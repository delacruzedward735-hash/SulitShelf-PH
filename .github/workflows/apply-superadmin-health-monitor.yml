name: Apply Superadmin Health Monitor

on:
  push:
    branches:
      - feature/superadmin-health-monitor-20260913

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: feature/superadmin-health-monitor-20260913

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply health monitor patch
        run: python scripts/_apply_superadmin_health_monitor.py

      - name: Remove one-time patcher
        run: |
          rm scripts/_apply_superadmin_health_monitor.py
          rm .github/workflows/apply-superadmin-health-monitor.yml

      - name: Commit generated implementation
        run: |
          git config user.name "CodeDev Health Monitor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "Add superadmin system health monitor"
          git push origin HEAD:feature/superadmin-health-monitor-20260913
