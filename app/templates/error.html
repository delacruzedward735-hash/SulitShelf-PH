{% extends "base.html" %}
{% block title %}{{ status }} · {{ title }} · SulitShelf PH{% endblock %}
{% block body_class %}error-page{% endblock %}
{% block body %}
<main class="error-shell">
  <a class="brand" href="{{ url_for('main.home') }}"><img class="brand-icon" src="{{ url_for('static', filename='images/brand-icon.webp') }}" alt=""><strong>SulitShelf <em>PH</em></strong></a>
  <section>
    <p class="eyebrow">ERROR {{ status }}</p>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <a class="button primary" href="{{ url_for('main.home') }}">Return to the public mall</a>
  </section>
</main>
{% endblock %}
