<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#f4f5f8;color:#17171d;font-family:Arial,sans-serif">
    <div style="max-width:620px;margin:0 auto;padding:32px;border:1px solid #e0e1e8;border-radius:18px;background:#fff">
      <p style="margin:0 0 8px;color:#ee4d2d;font-size:12px;font-weight:700;letter-spacing:.08em">SULITSHELF PH</p>
      <h1 style="margin:0 0 22px;font-size:27px">{{ message_subject }}</h1>
      <p style="margin:0 0 18px">Hi {{ display_name }},</p>
      <div style="margin:0 0 24px;white-space:pre-line;line-height:1.65">{{ message_body }}</div>
      <a href="{{ inbox_url }}" style="display:inline-block;padding:13px 18px;border-radius:9px;background:#ee4d2d;color:#fff;font-weight:700;text-decoration:none">Open private inbox</a>
      <p style="margin:26px 0 0;color:#777b86;font-size:12px">Need help? Contact {{ support_email }}.</p>
    </div>
  </body>
</html>
